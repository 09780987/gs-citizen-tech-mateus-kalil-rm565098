title = "Citizen Tech - deteccao adicional de credenciais de aplicacao"
[extend]
useDefault = true

[[rules]]
id = "flask-session-secret"
description = "Chave de assinatura da sessao Flask escrita no codigo"
regex = '''SECRET_KEY["']?\]\s*=\s*["']([^"'\r\n]{12,})["']'''
secretGroup = 1

[[rules]]
id = "jwt-signing-key"
description = "Chave JWT fixa no codigo"
regex = '''jwt\.encode\([^\r\n]*,\s*["']([^"'\r\n]{12,})["'],\s*algorithm'''
secretGroup = 1

[[rules]]
id = "default-admin-password"
description = "Senha administrativa padrao escrita em argumento de funcao"
regex = '''senha\s*=\s*["']([A-Za-z0-9!@#$%^&*_.+-]{10,})["']'''
secretGroup = 1

[[rules]]
id = "aws-secret-access-key-setting"
description = "Chave secreta AWS configurada no codigo"
regex = '''AWS_SECRET_ACCESS_KEY\s*=\s*["']([A-Za-z0-9/+=]{40})["']'''
secretGroup = 1
